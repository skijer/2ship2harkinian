name: generate-builds
# 2S2H [Unbound] Builds run by hand (Actions > generate-builds > Run workflow) or from a release tag, never on
# every push. A pushed "*unbound*" tag builds nothing itself: a tag ref cannot read the branch's caches, so it
# starts this workflow on the tag's branch with the tag as input, which checks the tag out, builds and publishes
# the release. Without a tag input a manual run only builds; publish-release.yml can release it later.
on:
  push:
    tags:
      - '*unbound*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (already pushed, on this branch); empty = build only
        default: ''
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:

  dispatch-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
    - name: Start the release run
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        BRANCH=$(.github/workflows/release-product.sh "$TAG" | sed -n 's/^branch=//p')
        gh workflow run main.yml -R "$GITHUB_REPOSITORY" --ref "$BRANCH" -f tag="$TAG"
        echo "Release run for ${TAG} started on ${BRANCH}"

  generate-2ship-otr:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-22.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
        ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
    - name: Check the release tag
      if: inputs.tag
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        BRANCH=$(.github/workflows/release-product.sh "$TAG" | sed -n 's/^branch=//p')
        if [ "$BRANCH" != "$GITHUB_REF_NAME" ]; then
          echo "::error::${TAG} is released from ${BRANCH}; this run is on ${GITHUB_REF_NAME}"
          exit 1
        fi
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.22
      with:
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-otr-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-otr-ccache-${{ github.ref }}
          ${{ runner.os }}-otr-ccache
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat .github/workflows/apt-deps.txt) libzip-dev zipcmp zipmerge ziptool
    - name: Restore Cached deps folder
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-deps-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-deps-${{ github.ref }}-
          ${{ runner.os }}-deps-
        path: deps
    - name: Create deps folder
      run: mkdir -p deps
    - name: Install latest SDL
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        if [ ! -d "deps/SDL2-2.30.3" ]; then
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz
          tar -xzf SDL2-2.30.3.tar.gz -C deps
        fi
        cd deps/SDL2-2.30.3
        ./configure --enable-hidapi-libusb
        make -j 10
        sudo make install
        sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
    - name: Install latest tinyxml2
      run: |
        sudo apt-get remove libtinyxml2-dev
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        if [ ! -d "deps/tinyxml2-10.0.0" ]; then
          wget https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
          tar -xzf 10.0.0.tar.gz -C deps
        fi
        cd deps/tinyxml2-10.0.0
        mkdir -p build
        cd build
        cmake ..
        make
        sudo make install
    - uses: ./.github/actions/install-sdl2-net
    - name: Generate 2ship.o2r
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release
        cmake --build build-cmake --config Release --target Generate2ShipOtr -j3
    - name: Upload 2ship.o2r
      uses: actions/upload-artifact@v7
      with:
        name: 2ship.o2r
        path: 2ship.o2r
        retention-days: 1

  build-macos:
    needs: generate-2ship-otr
    runs-on: macos-14
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
        ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
    - name: Setup Macports
      uses: melusina-org/setup-macports@v1
      with:
        parameters: '.github/macports.yml'
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.22
      with:
        key: ${{ runner.os }} # ccache-macos-{{ timestamp }}
        max-size: "2G"
        evict-old-files: job
        save: ${{ github.ref_name == github.event.repository.default_branch }}
    - name: Download 2ship.o2r
      uses: actions/download-artifact@v8
      with:
        name: 2ship.o2r
        path: build-cmake/mm
    - name: Build 2Ship
      env:
        CCACHE_SLOPPINESS: pch_defines,time_macros
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DS2H_MOD_POLICY=signed -DCMAKE_C_FLAGS="-Xclang -fno-pch-timestamp" -DCMAKE_CXX_FLAGS="-Xclang -fno-pch-timestamp"
        cmake --build build-cmake -j -- -k 0
        # Spotlight indexing the new disk image keeps hdiutil from unmounting it ("Resource busy").
        sudo mdutil -a -i off || true
        (cd build-cmake && cpack)

        mv _packages/*.dmg 2Ship.dmg
        mv README.md readme.txt
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: 2ship-mac
        path: |
          2Ship.dmg
          readme.txt
    - name: Build the unsafe mods edition
      env:
        CCACHE_SLOPPINESS: pch_defines,time_macros
      run: |
        cp readme.txt README.md
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -DS2H_MOD_POLICY=ask
        cmake --build build-cmake -j
        (cd build-cmake && cpack)
        mv _packages/*.dmg 2Ship-unbound-unsafe.dmg
    - name: Upload the unsafe mods edition
      uses: actions/upload-artifact@v7
      with:
        name: 2ship-unbound-unsafe-mac
        path: |
          2Ship-unbound-unsafe.dmg
          readme.txt

  build-linux:
    needs: generate-2ship-otr
    runs-on: ubuntu-22.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
        ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat .github/workflows/apt-deps.txt)
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.22
      with:
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref }}
          ${{ runner.os }}-ccache
    - name: Restore Cached deps folder
      id: restore-cache-deps
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-deps-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-deps-${{ github.ref }}-
          ${{ runner.os }}-deps-
        path: deps
    - name: Create deps folder
      run: mkdir -p deps
    - name: Install latest SDL
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        if [ ! -d "deps/SDL2-2.30.3" ]; then
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz
          tar -xzf SDL2-2.30.3.tar.gz -C deps
        fi
        cd deps/SDL2-2.30.3
        ./configure --enable-hidapi-libusb
        make -j 10
        sudo make install
        sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
    - name: Install latest tinyxml2
      run: |
        sudo apt-get remove libtinyxml2-dev
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        if [ ! -d "deps/tinyxml2-10.0.0" ]; then
          wget https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
          tar -xzf 10.0.0.tar.gz -C deps
        fi
        cd deps/tinyxml2-10.0.0
        mkdir -p build
        cd build
        cmake ..
        make
        sudo make install
    - uses: ./.github/actions/install-sdl2-net
    - name: Copy SDL libs to multiarch dir
      run: sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
    - name: Install libzip without crypto
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        if [ ! -d "deps/libzip-1.10.1" ]; then
          wget https://github.com/nih-at/libzip/releases/download/v1.10.1/libzip-1.10.1.tar.gz
          tar -xzf libzip-1.10.1.tar.gz -C deps
        fi
        cd deps/libzip-1.10.1
        mkdir -p build
        cd build
        cmake .. -DENABLE_COMMONCRYPTO=OFF -DENABLE_GNUTLS=OFF -DENABLE_MBEDTLS=OFF -DENABLE_OPENSSL=OFF
        make
        sudo make install
        sudo cp -av /usr/local/lib/libzip* /lib/x86_64-linux-gnu/
    - name: Download 2ship.o2r
      uses: actions/download-artifact@v8
      with:
        name: 2ship.o2r
        path: build-cmake/mm
    - name: Build 2Ship
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DBUILD_REMOTE_CONTROL=1 -DS2H_MOD_POLICY=signed
        cmake --build build-cmake --config Release -j3 -- -k 0
        (cd build-cmake && cpack -G External)

        mv README.md readme.txt
        mv build-cmake/*.appimage 2ship.appimage
      env:
        CC: gcc-12
        CXX: g++-12
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: 2ship-linux
        path: |
          2ship.appimage
          readme.txt
    - name: Build the unsafe mods edition
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        cp readme.txt README.md
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -DS2H_MOD_POLICY=ask
        cmake --build build-cmake --config Release -j3
        (cd build-cmake && cpack -G External)
        mv build-cmake/*.appimage 2ship-unbound-unsafe.appimage
      env:
        CC: gcc-12
        CXX: g++-12
    - name: Upload the unsafe mods edition
      uses: actions/upload-artifact@v7
      with:
        name: 2ship-unbound-unsafe-linux
        path: 2ship-unbound-unsafe.appimage
    - name: Save Cache deps folder
      if: ${{ github.ref_name == github.event.repository.default_branch }}
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-cache-deps.outputs.cache-primary-key }}
        path: deps

  build-windows:
    needs: generate-2ship-otr
    runs-on: windows-latest
    steps:
    - name: Install dependencies
      run: |
        choco install ninja -y
        Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
        ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
    - name: Configure sccache
      uses: hendrikmuhs/ccache-action@v1.2.22
      with:
        variant: sccache
        max-size: "2G"
        evict-old-files: job
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref }}
          ${{ runner.os }}-ccache
    - name: Restore Cached VCPKG folder
      id: restore-cache-vcpkg
      uses: actions/cache/restore@v4
      with:
        key: ${{ runner.os }}-vcpkg-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-${{ github.ref }}-
          ${{ runner.os }}-vcpkg-
        path: vcpkg
    - name: Configure Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
    - name: Download 2ship.o2r
      uses: actions/download-artifact@v8
      with:
        name: 2ship.o2r
        path: build-windows/mm
    - name: Build 2Ship
      env:
        VCPKG_ROOT: ${{github.workspace}}/vcpkg
      run: |
        set $env:PATH="$env:USERPROFILE/.cargo/bin;$env:PATH"
        cmake -S . -B build-windows -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DS2H_MOD_POLICY=signed
        cmake --build build-windows --config Release --parallel 10

        (cd build-windows && cpack)
        cd ..
        mv _packages/*.zip _packages/2ship-windows.zip
    # Mods link against 2ship.lib, the import library of 2ship.exe; it ships next to the exe and as its own artifact.
    - name: Find the mod import library
      run: |
        $lib = Get-ChildItem -Path build-windows -Recurse -Filter 2ship.lib | Select-Object -First 1
        if (-not $lib) { Write-Error "2ship.lib was not built"; exit 1 }
        New-Item -ItemType Directory -Force -Path mod-sdk-lib | Out-Null
        Copy-Item -Path $lib.FullName -Destination mod-sdk-lib/2ship.lib
    - name: Upload mod SDK import library
      uses: actions/upload-artifact@v7
      with:
        name: unbound-mod-sdk-windows
        if-no-files-found: error
        path: mod-sdk-lib/2ship.lib
    - name: Unzip package
      run: |
        Expand-Archive -Path _packages/2ship-windows.zip -DestinationPath 2ship-windows
        Copy-Item -Path mod-sdk-lib/2ship.lib -Destination 2ship-windows/2ship.lib
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: 2ship-windows
        path: 2ship-windows
    # The mod developers' edition asks before loading each unsigned mod; only ModLoader.cpp and the link rebuild.
    - name: Build the unsafe mods edition
      env:
        VCPKG_ROOT: ${{github.workspace}}/vcpkg
      run: |
        Remove-Item -Path _packages/*.zip -Force
        cmake -S . -B build-windows -DS2H_MOD_POLICY=ask
        cmake --build build-windows --config Release --parallel 10
        (cd build-windows && cpack)
        cd ..
        mv _packages/*.zip _packages/2ship-unbound-unsafe-windows.zip
        Expand-Archive -Path _packages/2ship-unbound-unsafe-windows.zip -DestinationPath 2ship-unbound-unsafe-windows
        Copy-Item -Path mod-sdk-lib/2ship.lib -Destination 2ship-unbound-unsafe-windows/2ship.lib
    - name: Upload the unsafe mods edition
      uses: actions/upload-artifact@v7
      with:
        name: 2ship-unbound-unsafe-windows
        path: 2ship-unbound-unsafe-windows
    - name: Save Cache VCPKG folder
      if: ${{ github.ref_name == github.event.repository.default_branch }}
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-cache-vcpkg.outputs.cache-primary-key }}
        path: vcpkg

  # A run with a tag input publishes its GitHub Release.
  release:
    needs: [build-macos, build-linux, build-windows]
    if: inputs.tag
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        ref: refs/tags/${{ inputs.tag }}
        fetch-depth: 0
    - name: Identify product
      id: product
      shell: bash
      run: |
        FACTS=$(.github/workflows/release-product.sh "$TAG")
        echo "$FACTS" >> "$GITHUB_OUTPUT"
        PRODUCT=$(sed -n 's/^product=//p' <<< "$FACTS")
        # Notes start at the previous tag of the same product, never at a pipeline test tag.
        PREV=$(git tag --sort=-creatordate | grep -- "$PRODUCT" | grep -v -- '-test$' | grep -vx -- "$TAG" | head -n 1 || true)
        echo "prev=$PREV" >> "$GITHUB_OUTPUT"
    - name: Download the builds
      uses: actions/download-artifact@v7
      with:
        pattern: 2ship-*
        path: rel
    - name: Package release assets
      run: |
        bash .github/workflows/package-release.sh "$TAG"
    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        PRODUCT: ${{ steps.product.outputs.product }}
        TITLE: ${{ steps.product.outputs.title }}
        PREV: ${{ steps.product.outputs.prev }}
        DRAFT: ${{ steps.product.outputs.draft }}
      run: |
        NOTES_FILE=".github/release-notes/${PRODUCT}.md"
        ARGS=(--title "$TITLE" --generate-notes)
        [ -n "$PREV" ] && ARGS+=(--notes-start-tag "$PREV")
        if [ -f "$NOTES_FILE" ]; then
          sed "s|{{TAG}}|$TAG|g" "$NOTES_FILE" > release-notes.md
          ARGS+=(--notes-file release-notes.md)
        fi
        [ "$DRAFT" = true ] && ARGS+=(--draft)
        gh release create "$TAG" dist/* "${ARGS[@]}"

  record-download-source:
    needs: [build-macos, build-linux, build-windows]
    if: github.ref_name == 'unbound-modapi' && !inputs.tag && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
    - name: Record the built commit for rolling downloads
      env:
        PROJECT: 2ship
      run: |
        jq -n --arg project "$PROJECT" --arg repository "$GITHUB_REPOSITORY" --arg commit "$GITHUB_SHA" \
          --argjson run_id "$GITHUB_RUN_ID" '{project: $project, repository: $repository, commit: $commit, run_id: $run_id}' > download-source.json
    - uses: actions/upload-artifact@v7
      with:
        name: unbound-download-source
        path: download-source.json
        retention-days: 7
